project: markdown-file-sharing-network-across-agents
runtime:
  telemetry-ui/src/app:
    purpose: Angular routes, components, services, guards and interfaces.
  telemetry-ui/src/theme:
    purpose: Application-owned design tokens and Angular primitives.
  telemetry-api/app.py:
    purpose: Create the fail-closed Flask application used by telemetry-lambda.
    functions:
      create_app: Validate configuration and register portal routes and middleware.
  telemetry-api/server.py:
    purpose: Dispatch Flask and FastMCP OAuth/protocol paths in one ASGI process.
    functions:
      TelemetryApplication: Dispatch MCP-owned ASGI paths and portal WSGI paths.
      create_app: Build the combined portal and MCP application.
  telemetry-api/routing.py:
    purpose: Route authenticated portal HTTP requests to domain services.
    functions:
      protect_api: Authenticate protected portal requests and bind their device.
      private_api_response: Prevent caching of protected responses.
      health: Return process readiness.
      current_user: Return the verified portal identity.
      portfolio_analytics: Validate and read or delete protected portfolio analytics.
      not_found: Return a machine-readable route error.
      read_documents: Read one document or document page.
      browser_dependencies: Create browser-session AWS clients lazily.
      browser_session: Create or restore a browser session.
      browser_logout: Revoke a browser session.
      portal_documents: Dispatch portal document, project, and task commands.
  telemetry-api/services/authentication_service.py:
    purpose: Own portal JWT, browser-session, and fixed device-binding behavior.
    functions:
      BrowserSessionService: Bundle browser session clients, configuration, and keys.
      AuthenticationError: Represent failed authentication.
      AuthorizationError: Represent missing portal authorization.
      validate_session_age: Enforce the fixed 90-day authentication deadline.
      validate_auth_config: Validate portal Cognito configuration.
      validate_access_claims: Validate client, token-use, group, and time claims.
      fetch_jwks: Fetch a bounded Cognito signing-key document.
      JwksCache: Cache and safely rotate portal signing keys.
      verify_access_token: Verify and authorize a portal access token.
      session_record: Bind a signed refresh family to reported device metadata.
      check_device: Register or require an existing device binding.
      session_key: Hash an opaque browser cookie.
      verify_session_identity: Preserve identity across access-token refresh.
      create_browser_session: Exchange and persist one browser refresh credential.
      read_browser_session: Read a valid device-bound browser session.
      authenticate_browser_session: Refresh and authenticate a browser session.
      validate_cookie_mutation: Enforce browser origin and CSRF protection.
      revoke_browser_session: Tombstone the local session and revoke upstream.
      browser_session_response: Project safe browser-session fields.
  telemetry-api/services/analytics_service.py:
    purpose: Validate, read, and delete bounded portfolio analytics records.
    functions:
      validate_analytics_query: Validate a caller-supplied analytics cursor.
      validate_analytics_delete: Validate bounded public event identities.
      normalize_event: Project safe event and visitor display fields.
      read_portfolio_events: Read one fixed-table analytics page.
      portfolio_event_identity: Derive a public identity from a stored event.
      resolve_portfolio_event_keys: Resolve public identities to exact private keys.
      delete_portfolio_events: Atomically delete resolved selected events.
  telemetry-api/services/native_upload_service.py:
    purpose: Verify native API Gateway requests and preserve signed upload bytes.
    functions:
      native_event: Reconstruct a verified Lambda upload event.
      native_upload: Execute native ingestion and return its exact receipt.
  telemetry-api/mcp_api/app.py:
    purpose: Build the authenticated stateless Markdown MCP application.
    functions:
      ProtocolLogFilter: Remove sensitive protocol diagnostics.
      configure_protocol_logging: Install sanitized protocol log handlers.
      create_app: Build discovery, OAuth, ingress, and MCP tool routes.
  telemetry-api/mcp_api/auth_service.py:
    purpose: Verify MCP tokens and bound ASGI protocol and OAuth ingress.
    functions:
      verify_access_token: Verify one Cognito MCP access token.
      IngressMiddleware: Authenticate, rate-limit, and bound MCP requests.
      OAuthIngressMiddleware: Protect and sanitize OAuth requests and responses.
  telemetry-api/mcp_api/oauth_service.py:
    purpose: Bridge Cognito OAuth and persist encrypted single-use state.
    functions:
      OAuthStateStore: Persist encrypted OAuth state and atomic claims in DynamoDB.
      CognitoVerifier: Adapt Cognito tokens to FastMCP access tokens.
      MarkdownOAuthProxy: Enforce redirect, redemption, refresh, and revocation rules.
      create_oauth: Build the configured Cognito OAuth proxy.
  telemetry-api/mcp_api/storage_service.py:
    purpose: Adapt MCP upload batches to shared document storage.
    functions:
      write_documents: Store one prepared batch with bounded AWS clients.
      save_batch: Return truthful READY and incomplete MCP receipts.
  telemetry-api/mcp_api/validation_service.py:
    purpose: Validate MCP deployment settings, redirects, and Markdown batches.
    functions:
      Metadata: Validate bounded Markdown metadata.
      MarkdownFile: Validate one Markdown file.
      UploadBatch: Validate one personal upload batch.
      prepare_payload: Validate complete batch bytes and destinations.
      load_config: Load and validate enabled MCP configuration.
      valid_oauth_redirect: Allow only approved ChatGPT and local callback URIs.
  telemetry-api/document_api/handler.py:
    purpose: Coordinate validated document commands across the two storage services.
    functions:
      proxy_response: Build a private no-store Lambda proxy response.
      execute_documents: Execute and sanitize one local portal command.
      lambda_handler: Route native and trusted portal operations.
  telemetry-api/document_api/dynamodb_document_service.py:
    purpose: Own document metadata, task, project, device and deletion persistence.
    functions:
      DocumentConflict: Represent a stale document or task revision.
      ProjectExists: Represent a conflicting normalized project name.
      DeletionConflict: Represent a conflicting deletion observation.
      encode_cursor: Encode a caller-bound continuation key.
      get_ready_record: Read one authorized ready index row.
      publish_record: Publish compact acknowledged metadata.
      document_summary: Project public document metadata.
      list_documents: Read one bounded document page.
      list_folders: Read owner-scoped document groups.
      plan_task: Derive task metadata from plan Markdown.
      task_summary: Project public linked-task metadata.
      list_tasks: Read one bounded linked-task page.
      update_task: Conditionally update linked task metadata.
      project_summary: Project public project metadata.
      list_projects: Read one bounded shared project page.
      create_project: Conditionally create an idempotent project.
      authorize_native_device: Consume a nonce and enforce device approval.
      record_deletion: Record an immutable deletion observation.
  telemetry-api/document_api/s3_document_service.py:
    purpose: Own Markdown object locations, writes, reads and edits.
    functions:
      DocumentStorage: Bundle document table, S3 client, and allowed buckets.
      source_binding: Bind an object path to its source project.
      storage_path: Build a plain S3 URI.
      storage_location: Resolve and validate compact storage metadata.
      legacy_storage_location: Validate expanded legacy storage metadata.
      store_path_document: Store one stable owner-path document.
      store_documents: Store a batch with truthful per-file outcomes.
      read_document: Read one authorized bounded Markdown object.
      replace_document: Replace current bytes conditionally by ETag.
      get_task: Return task metadata with its Markdown description.
      execute_portal: Dispatch validated portal storage operations.
  telemetry-api/document_api/validation.py:
    purpose: Validate upload, read, deletion, path and native-proof contracts.
    functions:
      validate_event: Validate and normalize native upload JSON.
      validate_relative_path: Normalize a safe project-relative Markdown path.
      path_document_identity: Derive stable file identity and S3 key from a path.
      validate_deletion: Validate an immutable deletion observation.
      validate_read_event: Validate trusted read and pagination commands.
      validate_upload_identity: Bind signed gateway identity to upload content.
      validate_native_proof: Verify the native device signature and nonce.
      validate_file_group: Validate a bounded storage group segment.
  telemetry-api/document_api/portal_validation.py:
    purpose: Validate trusted portal document, project, and task commands.
    functions:
      validate_project_event: Validate project commands and identity-bound cursors.
      validate_portal_event: Validate trusted portal storage commands.
  telemetry-api/document_api/portal_contract.py:
    purpose: Bind browser requests to verified identity and sanitize responses.
    functions:
      validate_document_request: Build an identity-bound document read command.
      validate_document_response: Project safe document read fields.
      portal_request: Build a verified browser document command.
      safe_task: Project a bounded identity-owned task.
      bounded_cursor: Project a bounded optional response cursor.
      portal_response: Project safe portal operation responses.
  telemetry-api/Dockerfile.lambda:
    purpose: Build the one Lambda Web Adapter container image.
infrastructure:
  aws-infrastructure/cdk/app.py:
    purpose: Synthesize fictitious topology examples; reject real-account targets.
  aws-infrastructure/cdk/telemetry_stack.py:
    purpose: Own the private UI bucket, telemetry-lambda, HTTP API, logs and IAM.
  aws-infrastructure/cdk/edge_stack.py:
    purpose: Adopt and update the existing CloudFront distribution in place.
  aws-infrastructure/cdk/mcp_edge_stack.py:
    purpose: Adopt the stable MCP distribution and migrate only its origin.
  aws-infrastructure/cdk/data_stack.py:
    purpose: Preserve document data while removing superseded compute.
  .github/workflows/validate.yml:
    purpose: Validate the current application without AWS credentials or deployment.
  aws-infrastructure/document-data.yaml:
    purpose: Retain document storage resources independently of compute.
  aws-infrastructure/auth.yaml:
    purpose: Preserve family-pool clients, sessions and device records.
  aws-infrastructure/username-auth.yaml:
    purpose: Preserve the username pool and portal/native clients.
tests:
  telemetry-ui/src/app/app.routes.spec.ts:
    purpose: Verify integrated route and authentication boundaries.
  tests:
    purpose: Focused API, document lifecycle, MCP, adapter and browser journeys.
  aws-infrastructure/cdk/tests/test_stacks.py:
    purpose: Verify CDK resources, concurrency and routes.

local-agent:
  strategic-memory-collector-agent:
    purpose: Independent LangGraph collector with a root CLI and service modules.
    code-map: strategic-memory-collector-agent/code-map.yaml
validation:
  .github/workflows/validate.yml:
    purpose: Run compact runtime/CDK, collector and UI checks without cloud credentials.
