[project]
name = "strategic-memory-collector-agent"
version = "0.1.0"
description = "Asynchronous evidence-bound strategic memory collection with LangGraph and Bedrock Qwen"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.42",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "pydantic>=2.10",
]

[project.scripts]
strategic-memory-collector-agent = "cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["cli.py", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
