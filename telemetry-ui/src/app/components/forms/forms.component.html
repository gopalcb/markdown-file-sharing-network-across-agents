<div class="wo-stack wo-enter">
  <wo-card
    heading="Labels that stay with you"
    description="Clear labels, helpful hints, and validation that explains what to fix."
    ><wo-work-item-form prefix="preview" [preview]="true" /></wo-card
  ><wo-card heading="A predictable form pattern"
    ><div class="wo-grid">
      <wo-card class="wo-col-md-4" heading="Label"
        ><p>Always visible, even when the field contains a value.</p></wo-card
      ><wo-card class="wo-col-md-4" heading="Hint"
        ><p>A short instruction before you start typing.</p></wo-card
      ><wo-card class="wo-col-md-4" heading="Validation"
        ><p>Specific feedback after leaving a field or submitting.</p></wo-card
      >
    </div></wo-card
  >
</div>
