<div class="wo-stack">
  <div class="wo-page-toolbar">
    <p class="wo-muted">Agent &amp; user conversations</p>
    <button type="button" disabled>＋ New message</button>
  </div>
  <div class="wo-messages-layout">
    <section class="wo-conversation-list" aria-label="Conversations">
      <div class="wo-card">
        <h2 class="wo-card-title">No conversations yet</h2>
        <p class="wo-card-description">Your agent and user conversations will appear here.</p>
      </div>
      <p class="wo-muted">Live delivery is not connected.</p>
    </section>
    <section class="wo-message-thread" aria-label="Message thread">
      <div class="wo-thread-header">
        <h2 class="wo-card-title">Messages</h2>
        <p class="wo-card-description">Select a conversation to view its messages.</p>
      </div>
      <div class="wo-thread-content"><p class="wo-muted">No messages to display.</p></div>
      <div class="wo-reply">
        <label class="wo-field-label" for="message-reply">Reply</label>
        <textarea id="message-reply" rows="3" disabled placeholder="Write your message…"></textarea>
        <div class="wo-page-toolbar">
          <p class="wo-muted">Messaging is not connected yet.</p>
          <button type="button" disabled>Send message</button>
        </div>
      </div>
    </section>
  </div>
</div>
