AWSTemplateFormatVersion: '2010-09-09'
Description: Upload client and device/session binding table for an existing Cognito
  pool.
Parameters:
  EnableEmailOtp:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'false'
    - 'true'
    Description: Enable choice-based authentication on this client; configure the existing pool separately.
  ExistingUserPoolId:
    Type: String
    Description: Existing pool to which the public upload client is attached.
Conditions:
  EmailOtpEnabled:
    Fn::Equals:
    - Ref: EnableEmailOtp
    - 'true'
Resources:
  SessionDevices:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: softrobots-auth-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: session_id
        AttributeType: S
      KeySchema:
      - AttributeName: session_id
        KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
  UploadClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: ExistingUserPoolId
      ClientName: work-organizer-document-upload
      GenerateSecret: false
      ExplicitAuthFlows:
        Fn::If:
        - EmailOtpEnabled
        - - ALLOW_USER_AUTH
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        - - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 5
      IdTokenValidity: 5
      RefreshTokenValidity: 90
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
Outputs:
  SessionDevicesTableName:
    Value:
      Ref: SessionDevices
  UserPoolId:
    Value:
      Ref: ExistingUserPoolId
  UploadClientId:
    Value:
      Ref: UploadClient
