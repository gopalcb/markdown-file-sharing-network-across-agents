AWSTemplateFormatVersion: '2010-09-09'
Description: Work Organizer clients and retained session tables for the existing family pool.
Parameters:
  ExistingUserPoolId:
    Type: String
    Default: ca-central-1_yXCtjKCHu
    AllowedValues: [ca-central-1_yXCtjKCHu]
  ExistingDomainPrefix:
    Type: String
    Default: ca-central-1yxctjkchu
    AllowedValues: [ca-central-1yxctjkchu]
  PortalOrigin:
    Type: String
    Default: https://d2f8oftnpxmjan.cloudfront.net
    AllowedValues: [https://d2f8oftnpxmjan.cloudfront.net]
Resources:
  BrowserSessions:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: softrobots-browser-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: session_id, AttributeType: S}]
      KeySchema: [{AttributeName: session_id, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
  SessionDevices:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: softrobots-auth-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: session_id, AttributeType: S}]
      KeySchema: [{AttributeName: session_id, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true}
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
  PortalUsers:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref ExistingUserPoolId
      GroupName: portal-users
      Description: Explicit portal access; no AWS role or automatic membership.
  Client:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref ExistingUserPoolId
      ClientName: work-organizer-portal
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub '${PortalOrigin}/work-organizer/auth/callback']
      LogoutURLs: [!Sub '${PortalOrigin}/work-organizer/signed-out']
      ExplicitAuthFlows: [ALLOW_USER_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 5
      IdTokenValidity: 5
      RefreshTokenValidity: 90
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}
  UploadClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref ExistingUserPoolId
      ClientName: work-organizer-document-upload
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 5
      IdTokenValidity: 5
      RefreshTokenValidity: 90
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}
Outputs:
  BrowserSessionsTableName: {Value: !Ref BrowserSessions}
  SessionDevicesTableName: {Value: !Ref SessionDevices}
  UserPoolId: {Value: !Ref ExistingUserPoolId}
  Issuer:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${ExistingUserPoolId}'
  ClientId: {Value: !Ref Client}
  UploadClientId: {Value: !Ref UploadClient}
  Domain:
    Value: !Sub 'https://${ExistingDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  RedirectUri: {Value: !Sub '${PortalOrigin}/work-organizer/auth/callback'}
  LogoutUri: {Value: !Sub '${PortalOrigin}/work-organizer/signed-out'}
  Group: {Value: !Ref PortalUsers}
