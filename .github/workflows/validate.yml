name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check telemetry-api aws-infrastructure/cdk tests
      - run: ruff format --check telemetry-api aws-infrastructure/cdk tests
      - run: python -m pytest tests aws-infrastructure/cdk/tests -q
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_DEFAULT_REGION: ca-central-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
      - run: cfn-lint aws-infrastructure/*.yaml
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --project strategic-memory-collector-agent --locked
      - run: uv run --locked pytest -q && uv run --locked ruff check .
        working-directory: strategic-memory-collector-agent
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          WO_BROWSER_EVIDENCE: /tmp/markdown-ui-browser
